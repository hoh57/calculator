<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Calculator</title>
<style>
:root{color-scheme:dark;--bg:#000;--num:#f2f2f2;--ntxt:#000;--fn:#333;--op:#e3923b;--otxt:#fff;--muted:#8e8e93;--txt:#fff;--hist:#e5e5e5;--press:#1c1c1e;--bar:#232323;--grp:#1a1a1a;--line:#2a2a2a;--sci:#2a2a2c;--scion:#636366;--pill:rgba(58,58,60,.92);--on:#34c759}
/* Themes: each one only swaps the colours above */
:root[data-theme="sakura"]{--bg:#1c0f16;--num:#ffd6e5;--ntxt:#6a2445;--fn:#4d2a3c;--op:#ff6f9f;--muted:#b896a7;--hist:#f6dce7;--press:#2e1924;--bar:#2c1822;--grp:#24141c;--line:#3b2431;--sci:#3a2230;--scion:#80506a;--pill:rgba(77,42,60,.94);--on:#ff6f9f}
:root[data-theme="lavender"]{--bg:#15111d;--num:#e9e0fb;--ntxt:#3f2b69;--fn:#3b3252;--op:#ac85ff;--muted:#a69dbf;--hist:#ebe4f8;--press:#231c31;--bar:#251f34;--grp:#1d182a;--line:#332b47;--sci:#2f2843;--scion:#6c5c93;--pill:rgba(59,50,82,.94);--on:#ac85ff}
:root[data-theme="peach"]{--bg:#1c1412;--num:#fbe0d3;--ntxt:#6b3524;--fn:#4c3631;--op:#f0907a;--muted:#bba095;--hist:#f7e5dd;--press:#2d201d;--bar:#2c201d;--grp:#241a18;--line:#3c2c28;--sci:#3a2a26;--scion:#86605a;--pill:rgba(76,54,49,.94);--on:#f0907a}
:root[data-theme="blush"]{color-scheme:light;--bg:#fff0f5;--num:#fff;--ntxt:#7a2f52;--fn:#ffd3e2;--op:#ff6f9f;--muted:#b67f97;--txt:#4f1f36;--hist:#6d2b4a;--press:#ffe0eb;--bar:#ffdbe7;--grp:#fff;--line:#f6d5e1;--sci:#ffe0eb;--scion:#f7a6c3;--pill:rgba(255,211,226,.96);--on:#ff6f9f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) calc(env(safe-area-inset-right) + 10px) max(12px, calc(env(safe-area-inset-bottom) - 4px)) calc(env(safe-area-inset-left) + 10px);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:480px;margin:0 auto}
.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;text-align:right}
.tape{flex:0 1 auto;min-height:0;overflow-y:auto;padding:8px 0;font-size:clamp(18px,5.5vw,26px);overscroll-behavior:contain}
.tape[hidden]{display:none}
.tape{scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.sbar{position:absolute;right:-7px;width:3px;border-radius:2px;background:var(--muted);opacity:0;transition:opacity .4s;pointer-events:none;z-index:1}
.sbar.show{opacity:.9}
.date{color:var(--op);font-weight:500;margin:10px 0 4px}
.entry{display:block;width:100%;background:none;border:0;color:var(--muted);text-align:right;font:inherit;padding:4px 2px;word-break:break-all;cursor:pointer;border-radius:8px}
.entry b{color:var(--hist);font-weight:400}
.entry:active{background:var(--press)}
.fs{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 14px;border:0;border-radius:999px;background:var(--pill);color:var(--txt);font-size:15px;font-family:inherit;white-space:nowrap;cursor:pointer;z-index:1;opacity:0;pointer-events:none;transition:opacity .4s}
.fs.show,.fs:focus-visible,.app.full .fs{opacity:1;pointer-events:auto}
.fs[hidden]{display:none}
.fs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fs:focus-visible{outline:3px solid #5ac8fa;outline-offset:2px}
.screen:has(.fs:not([hidden])) .tape{padding-top:62px}
.app.full .keys,.app.full .preview,.app.full .main{display:none}
.app.full .tape{flex:1;display:flex;flex-direction:column}
.app.full .tape>:first-child{margin-top:auto}
#settings{margin:0;padding:0;border:0;width:100%;height:100%;max-width:none;max-height:none;background:var(--bg);color:var(--txt)}
#settings .view{min-height:100%;padding-bottom:env(safe-area-inset-bottom)}
#settings header{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:10px 14px;background:var(--bar)}
#settings h2{text-align:center;font-size:19px;font-weight:600}
.hbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--fn);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn.ok{background:var(--op);color:var(--otxt);justify-self:end}
.hbtn svg,.row svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.group{margin-top:30px;background:var(--grp)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--txt);font-size:18px;font-family:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .val{display:flex;align-items:center;gap:4px;color:var(--muted)}
.dot{display:inline-flex;gap:3px;margin-left:auto}.dot i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.35)}
.row input[switch]{margin:0;accent-color:var(--on)}
#settings :focus-visible{outline:3px solid #5ac8fa;outline-offset:-3px}
#settings:focus{outline:none}
.empty{color:var(--muted);font-size:16px;padding:12px 0}
.recover{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:none;border:0;color:var(--muted);font-size:clamp(17px,5vw,22px);font-family:inherit;padding:12px 0;cursor:pointer}
.recover svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recover:focus-visible{outline:3px solid #5ac8fa;outline-offset:2px}

.preview{flex-shrink:0;color:var(--muted);font-size:clamp(20px,6vw,28px);min-height:1.3em;margin-top:6px;overflow:hidden;white-space:nowrap}
.main{flex-shrink:0;font-weight:300;line-height:1.2;white-space:nowrap;overflow:hidden;padding-bottom:10px;max-height:calc(3.6em + 10px)}
.main.wrap{white-space:normal;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:5px;width:min(100%,64dvh);aspect-ratio:1;margin:0 auto}
.k{min-width:0;min-height:0;white-space:nowrap;border:0;border-radius:999px;font-size:clamp(26px,11.5vw,46px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);background:var(--fn);font-family:inherit;-webkit-tap-highlight-color:transparent}
.k{transition:transform .15s ease,filter .15s ease}
.cell:active{z-index:2}
.cell:active .k{transform:scale(1.18);filter:brightness(1.35)}
.cell:active .n{filter:brightness(.85)}
.sci{position:absolute;top:0;left:0;right:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:44px;gap:8px;padding:6px 0 10px}
.sci[hidden],.app.full .sci{display:none}
.s{background:var(--sci);font-size:clamp(14px,4.8vw,20px)}
.s.on{background:var(--scion)}
.cell{position:relative;display:grid;min-width:0;min-height:0}
.cell>.k{width:100%;height:100%}
.tick{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.f{font-size:clamp(20px,8vw,32px)}
.k:focus-visible,.entry:focus-visible{outline:3px solid #5ac8fa;outline-offset:2px}
.n{background:var(--num);color:var(--ntxt)}
.o{background:var(--op);color:var(--otxt);font-size:clamp(30px,12.5vw,50px)}
.zero{grid-column:span 2}
.eq{grid-column:5;grid-row:4/6}
.k svg{width:40%;height:40%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<script>try{const t=JSON.parse(localStorage.getItem('calc-settings')||'{}').theme;if(typeof t==='string')document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
<div class="app">
  <div class="sci" id="sci" hidden></div>
  <div class="screen">
    <button class="fs" id="fsBtn" type="button" hidden aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg><span>Full Screen</span></button>
    <div class="tape" id="tape" aria-label="History"></div>
    <div class="sbar" id="sbar" aria-hidden="true"></div>
    <div class="preview" id="preview" aria-hidden="true"></div>
    <div class="main" id="main" role="status" aria-live="polite">0</div>
  </div>
  <div class="keys">
    <button class="k f" data-k="ac" aria-label="All clear">AC</button>
    <button class="k f" data-k="neg" aria-label="Change sign">+/−</button>
    <button class="k f" data-k="pct" aria-label="Percent">%</button>
    <button class="k" data-k="back" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <button class="k" data-k="sci" aria-label="Scientific keys"><svg viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5" cy="5" r="2.3"/><circle cx="12" cy="5" r="2.3"/><circle cx="19" cy="5" r="2.3"/><circle cx="5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="19" cy="12" r="2.3"/><circle cx="5" cy="19" r="2.3"/><circle cx="12" cy="19" r="2.3"/><circle cx="19" cy="19" r="2.3"/></g></svg></button>

    <button class="k n" data-k="7">7</button>
    <button class="k n" data-k="8">8</button>
    <button class="k n" data-k="9">9</button>
    <button class="k o" data-k="÷" aria-label="Divide">÷</button>
    <button class="k" data-k="clear" aria-label="Clear history"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>

    <button class="k n" data-k="4">4</button>
    <button class="k n" data-k="5">5</button>
    <button class="k n" data-k="6">6</button>
    <button class="k o" data-k="×" aria-label="Multiply">×</button>
    <button class="k" data-k="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>

    <button class="k n" data-k="1">1</button>
    <button class="k n" data-k="2">2</button>
    <button class="k n" data-k="3">3</button>
    <button class="k o" data-k="−" aria-label="Minus">−</button>
    <button class="k o eq" data-k="eq" aria-label="Equals">=</button>

    <button class="k n zero" data-k="0">0</button>
    <button class="k n" data-k="." aria-label="Decimal point">.</button>
    <button class="k o" data-k="+" aria-label="Plus">+</button>
  </div>
</div>

<dialog id="settings" aria-labelledby="setTitle" tabindex="-1" autofocus>
  <div class="view" id="setMain">
    <header><span></span><h2 id="setTitle">Settings</h2><button type="button" class="hbtn ok" id="setDone" aria-label="Done"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button></header>
    <div class="group">
      <label class="row">History <input type="checkbox" switch id="optTape"></label>
      <label class="row">Keyboard Vibration <input type="checkbox" switch id="optHaptics"></label>
    </div>
    <div class="group">
      <button type="button" class="row" id="openTheme" aria-describedby="themeVal">Theme <span class="val"><span id="themeVal">Classic</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></button>
      <button type="button" class="row" id="openDp" aria-describedby="dpVal">Decimal Places <span class="val"><span id="dpVal">Unlimited</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></button>
    </div>
  </div>
  <div class="view" id="setDp" hidden>
    <header><button type="button" class="hbtn" id="dpBack" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2>Decimal Places</h2><span></span></header>
    <div class="group" id="dpList" role="radiogroup" aria-label="Decimal places"></div>
  </div>
  <div class="view" id="setTheme" hidden>
    <header><button type="button" class="hbtn" id="themeBack" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2>Theme</h2><span></span></header>
    <div class="group" id="themeList" role="radiogroup" aria-label="Theme"></div>
  </div>
</dialog>

<script>
const OPS = ['+', '−', '×', '÷', '^', 'ʸ√', 'logᵧ'];
const $ = id => document.getElementById(id);
const mainEl = $('main'), prevEl = $('preview'), tapeEl = $('tape');
const appEl = document.querySelector('.app'), fsBtn = $('fsBtn');

// Saved history stays in this browser only; works without storage too.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const isEntry = h => h && typeof h.e === 'string' && typeof h.r === 'string'
  && typeof h.t === 'number' && isFinite(parseFloat(h.r));
const loadList = k => { const v = store.get(k, []); return Array.isArray(v) ? v.filter(isEntry) : []; };
let history = loadList('calc-history');
let trash = loadList('calc-trash'); // last cleared history, so it can be recovered
const DPS = ['auto', '0', '1', '2', '3', '4', '5'];
const saved = store.get('calc-settings', {}) || {};
const settings = {
  haptics: saved.haptics !== false,
  dp: DPS.includes(saved.dp) ? saved.dp : 'auto',
  rad: saved.rad === true,
  theme: 'classic'
};
// Answer as text, rounded to the chosen decimal places
function result(v) {
  if (settings.dp === 'auto') return toStr(v);
  const s = clean(v).toFixed(+settings.dp);
  return /^-0(\.0+)?$/.test(s) ? s.slice(1) : s;
}

let tokens = [];   // e.g. ['12.5', '+', '3']
let fresh = false; // last number is a result: typing a digit replaces it
let error = false;
// The sum being typed is kept too, so closing the app doesn't lose it
const cur = store.get('calc-current', null);
if (cur && Array.isArray(cur.tokens) && cur.tokens.length <= 300
    && cur.tokens.every(t => typeof t === 'string' && t.length && t.length <= 40)) {
  tokens = cur.tokens;
  fresh = cur.fresh === true;
}

const isOp = t => OPS.includes(t);
const last = () => tokens[tokens.length - 1];
// A "%" typed straight after an operator (5−%6) sits in front of its number
const preEnd = a => a.at(-1) === '%' && (a.length < 2 || isOp(a.at(-2)) || isOpen(a.at(-2)));
const dangling = a => isOp(a.at(-1)) || isOpen(a.at(-1)) || preEnd(a);
const clean = n => { const r = parseFloat(n.toPrecision(15)); return Object.is(r, -0) ? 0 : r; };
const toStr = n => String(clean(n));
const isLit = t => /^-?[\d.]/.test(t);           // a typed number or an answer
const isConst = t => /^-?[πe]$/.test(t);
const isNum = t => t !== undefined && (isLit(t) || isConst(t));
const isOpen = t => t !== undefined && t.endsWith('('); // "(" or a function like "sin("
const numVal = t => {
  const n = t[0] === '-', b = n ? t.slice(1) : t;
  const v = b === 'π' ? Math.PI : b === 'e' ? Math.E : parseFloat(b);
  return n ? -v : v;
};
const toRad = x => settings.rad ? x : x * Math.PI / 180;
const fromRad = x => settings.rad ? x : x * 180 / Math.PI;
const snap = x => Math.abs(x) < 1e-12 ? 0 : x;       // sin(180°) = 0, not 1e-16
const fact = x => {
  if (x < 0 || x > 170 || !Number.isInteger(x)) return NaN;
  let r = 1;
  for (let i = 2; i <= x; i++) r *= i;
  return r;
};
const FN = {
  '(': x => x,
  'sin(': x => snap(Math.sin(toRad(x))), 'cos(': x => snap(Math.cos(toRad(x))),
  'tan(': x => (!settings.rad && Math.abs(x % 180) === 90) ? NaN : snap(Math.tan(toRad(x))),
  'sin⁻¹(': x => fromRad(Math.asin(x)), 'cos⁻¹(': x => fromRad(Math.acos(x)), 'tan⁻¹(': x => fromRad(Math.atan(x)),
  'sinh(': Math.sinh, 'cosh(': Math.cosh, 'tanh(': Math.tanh,
  'sinh⁻¹(': Math.asinh, 'cosh⁻¹(': Math.acosh, 'tanh⁻¹(': Math.atanh,
  'ln(': Math.log, 'log₁₀(': Math.log10, 'log₂(': Math.log2,
  'e^(': Math.exp, '10^(': x => 10 ** x, '2^(': x => 2 ** x,
  '√(': Math.sqrt, '∛(': Math.cbrt
};
const POST = { '!': fact, '²': x => x * x, '³': x => x ** 3 };
const POW = {
  '^': (a, b) => a ** b,
  'ʸ√': (a, b) => (a < 0 && Number.isInteger(b) && b % 2) ? -((-a) ** (1 / b)) : a ** (1 / b), // x ʸ√ y = y-th root of x
  'logᵧ': (a, b) => Math.log(a) / Math.log(b)                                                   // x logᵧ y = log base y of x
};
const needsCalc = () => tokens.length > 1 || (tokens.length === 1 && !isLit(tokens[0]));

function fmtTok(t) {
  if (!isLit(t) || /e/.test(t)) return t;
  const neg = t[0] === '-', b = neg ? t.slice(1) : t, i = b.indexOf('.');
  const int = (i < 0 ? b : b.slice(0, i)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + int + (i < 0 ? '' : '.' + b.slice(i + 1));
}
const exprText = toks => toks.map(fmtTok).join('');

// Order: brackets/functions, then x!, x², then powers, then × ÷, then + −.
// A number next to a bracket or function multiplies (2π, 2(3+4)). Missing ")" are closed. No eval().
function evaluate(toks) {
  toks = toks.slice();
  while (toks.length && dangling(toks)) toks.pop();
  if (!toks.length) return NaN;
  let i = 0, pct = false; // pct: the term just read was a lone "b%"
  const peek = () => toks[i];
  const expr = () => {
    let v = term();
    while (peek() === '+' || peek() === '−') {
      const o = toks[i++];
      let r = term();
      if (pct) r *= v; // a ± b% → a ± (b% of a)
      v = o === '+' ? v + r : v - r;
    }
    return v;
  };
  const term = () => {
    pct = false;
    let v = power(), lone = pct;
    for (;;) {
      const t = peek();
      if (t === '×' || t === '÷') { i++; lone = false; const r = power(); v = t === '×' ? v * r : r === 0 ? NaN : v / r; }
      else if (isNum(t) || isOpen(t) || t === '%') { lone = false; v *= power(); }
      else { pct = lone; return v; }
    }
  };
  const power = () => { const b = post(), f = POW[peek()]; if (!f) return b; i++; const v = f(b, power()); pct = false; return v; };
  const post = () => { // "%6" or "6%" = 6 ÷ 100
    let p = peek() === '%';
    if (p) i++;
    let v = prim();
    for (;;) {
      if (POST[peek()]) v = POST[toks[i++]](v);
      else if (peek() === '%' && !p) { i++; p = true; }
      else break;
    }
    pct = p;
    return p ? v / 100 : v;
  };
  const prim = () => {
    const t = toks[i++];
    if (isNum(t)) return numVal(t);
    if (isOpen(t)) { const v = expr(); if (peek() === ')') i++; return FN[t] ? FN[t](v) : NaN; }
    return NaN;
  };
  const v = expr();
  return i < toks.length ? NaN : v;
}

function resetIfError() { if (error) { error = false; tokens = []; } }

// Where the last number or bracket group starts (-1 if the expression ends in an operator)
function operandStart() {
  let j = tokens.length - 1;
  while (j >= 0 && (POST[tokens[j]] || (tokens[j] === '%' && j > 0 && !preEnd(tokens.slice(0, j + 1))))) j--;
  if (j < 0) return -1;
  if (isNum(tokens[j])) return j;
  if (tokens[j] !== ')') return -1;
  for (let d = 0; j >= 0; j--) {
    if (tokens[j] === ')') d++;
    else if (isOpen(tokens[j]) && --d === 0) return j;
  }
  return -1;
}
// sin, √, ln…: applies to the number just typed (30 sin → sin(30)), else opens "sin("
function func(f) {
  resetIfError();
  const s = operandStart();
  if (s < 0) tokens.push(f);
  else if (tokens[s] === '(' && last() === ')') tokens[s] = f; // (π÷2) sin → sin(π÷2)
  else { tokens.splice(s, 0, f); tokens.push(')'); }
  fresh = false;
  render();
}
function postfix(p) {
  if (error || operandStart() < 0) return;
  tokens.push(p);
  fresh = false;
  render();
}
function openParen() {
  resetIfError();
  if (fresh) tokens = [];
  fresh = false;
  tokens.push('(');
  render();
}
function closeParen() {
  const open = tokens.filter(isOpen).length - tokens.filter(t => t === ')').length;
  if (error || open <= 0 || operandStart() < 0) return;
  tokens.push(')');
  fresh = false;
  render();
}
function constant(c) { // π, e, Rand
  resetIfError();
  if (fresh && isNum(last())) tokens.pop();
  tokens.push(c === 'rand' ? String(+Math.random().toFixed(10)) : c);
  fresh = c === 'rand';
  render();
}

function digit(d) {
  resetIfError();
  if (fresh && isNum(last())) tokens.pop();
  fresh = false;
  if (!tokens.length || !isLit(last()) || /e/.test(last())) { tokens.push(d === '.' ? '0.' : d); return render(); }
  let t = last();
  if (d === '.') { if (t.includes('.')) return; t += '.'; }
  else {
    if (t.replace(/[-.]/g, '').length >= 15) return;
    t = t === '0' ? d : t === '-0' ? '-' + d : t + d;
  }
  tokens[tokens.length - 1] = t;
  render();
}

function op(o) {
  resetIfError();
  fresh = false;
  if (!tokens.length) tokens.push('0');
  if (preEnd(tokens)) tokens.pop();
  if (isOpen(last())) { if (o === '−') { tokens.push('-0'); render(); } return; }
  if (isOp(last())) tokens[tokens.length - 1] = o;
  else {
    if (last().endsWith('.')) tokens[tokens.length - 1] = last().slice(0, -1);
    tokens.push(o);
  }
  render();
}

function negate() {
  if (error) return;
  if (!isNum(last())) { tokens.push('-0'); fresh = false; return render(); }
  const t = last();
  tokens[tokens.length - 1] = t[0] === '-' ? t.slice(1) : '-' + t;
  render();
}

// % stays on screen like Calculator+: 100−6% or 100−%6 = 94 (b% of a for + −), 200×10% = 20, 6% = 0.06
function percent() {
  if (error || !tokens.length || last() === '%') return;
  if (!isOp(last()) && !isOpen(last())) {
    const s = operandStart();
    if (s < 0 || tokens[s - 1] === '%') return; // already "%6"
  }
  tokens.push('%');
  fresh = false;
  render();
}

function back() {
  if (error) { error = false; tokens = []; return render(); }
  if (!tokens.length) return;
  const t = last();
  if (!isLit(t) || /e/.test(t) || fresh) tokens.pop();
  else {
    const s = t.slice(0, -1);
    if (s === '' || s === '-') tokens.pop(); else tokens[tokens.length - 1] = s;
  }
  fresh = false;
  render();
}

function equals() {
  if (error || !tokens.length) return;
  while (tokens.length && dangling(tokens)) tokens.pop();
  if (!needsCalc()) return render();
  for (let n = tokens.filter(isOpen).length - tokens.filter(t => t === ')').length; n > 0; n--) tokens.push(')');
  const v = evaluate(tokens);
  if (!isFinite(v)) { error = true; tokens = []; fresh = false; return render(); }
  const r = result(v);
  history.push({ e: exprText(tokens), r, t: Date.now() });
  if (history.length > 500) history = history.slice(-500);
  store.set('calc-history', history);
  tokens = [r];
  fresh = true;
  renderTape();
  render();
}

// Full size until the line is full, then shrink just enough to fit; below the minimum, wrap.
function fit() {
  const max = Math.min(80, innerWidth * 0.2), min = Math.max(40, max * 0.7);
  mainEl.classList.remove('wrap');
  mainEl.style.fontSize = max + 'px';
  const ratio = mainEl.clientWidth / mainEl.scrollWidth;
  if (ratio >= 1) return;
  const s = Math.floor(max * ratio);
  if (s >= min) { mainEl.style.fontSize = s + 'px'; return; }
  mainEl.style.fontSize = min + 'px';
  mainEl.classList.add('wrap');
  mainEl.scrollTop = mainEl.scrollHeight;
}

// Jump to the newest history line. If a flick is still gliding, iOS keeps it going
// after a jump, so briefly switch scrolling off to stop it first.
function toBottom() {
  const end = tapeEl.scrollHeight;
  if (end - tapeEl.clientHeight - tapeEl.scrollTop <= 1) return;
  tapeEl.style.overflowY = 'hidden';
  tapeEl.scrollTop = end;
  requestAnimationFrame(() => { tapeEl.style.overflowY = ''; tapeEl.scrollTop = tapeEl.scrollHeight; });
}

function render() {
  mainEl.textContent = error ? 'Error' : tokens.length ? exprText(tokens) : '0';
  let pv = '';
  if (!error && needsCalc()) {
    const v = evaluate(tokens);
    if (isFinite(v)) pv = '= ' + fmtTok(result(v));
  }
  prevEl.textContent = pv;
  store.set('calc-current', { tokens: error ? [] : tokens, fresh });
  fit();
  toBottom();
}

// Full screen history: hide the keypad, history fills the screen
function setFull(on) {
  appEl.classList.toggle('full', on);
  fsBtn.setAttribute('aria-pressed', String(on));
  fsBtn.querySelector('span').textContent = on ? 'Exit Full Screen' : 'Full Screen';
  if (!on) fit();
  toBottom();
}
function syncFs() {
  fsBtn.hidden = tapeEl.hidden || !history.length;
  if (fsBtn.hidden && appEl.classList.contains('full')) setFull(false);
}
// Full Screen pill and a thin scrollbar show while you scroll the history, then fade out
const sbar = $('sbar');
function placeBar() {
  const { scrollTop: t, scrollHeight: sh, clientHeight: ch, offsetTop: top } = tapeEl;
  if (tapeEl.hidden || sh <= ch + 1) return false;
  const h = Math.max(36, ch * ch / sh);
  sbar.style.height = h + 'px';
  sbar.style.top = top + (t / (sh - ch)) * (ch - h) + 'px';
  return true;
}
let lastTouch = 0, pillTimer = 0;
['touchstart', 'touchmove', 'touchend', 'wheel', 'pointerdown'].forEach(t =>
  tapeEl.addEventListener(t, () => { lastTouch = Date.now(); }, { passive: true }));
tapeEl.addEventListener('scroll', () => {
  if (Date.now() - lastTouch > 1500) return; // ignore scrolling done by the app itself
  fsBtn.classList.add('show');
  sbar.classList.toggle('show', placeBar());
  clearTimeout(pillTimer);
  pillTimer = setTimeout(() => { fsBtn.classList.remove('show'); sbar.classList.remove('show'); }, 1500);
}, { passive: true });
fsBtn.addEventListener('click', e => {
  if (e.detail) fsBtn.blur();
  setFull(!appEl.classList.contains('full'));
});

function renderTape() {
  tapeEl.textContent = '';
  syncFs();
  if (!history.length) {
    if (trash.length) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'recover';
      b.setAttribute('aria-label', 'Recover cleared history');
      b.innerHTML = 'Long Press <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg> Recover History';
      tapeEl.append(b);
    } else {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No history yet';
      tapeEl.append(p);
    }
    return;
  }
  const year = new Date().getFullYear();
  let lastDay = '';
  history.forEach((h, i) => {
    const d = new Date(h.t), day = d.toDateString();
    if (day !== lastDay) {
      lastDay = day;
      const el = document.createElement('div');
      el.className = 'date';
      el.textContent = d.toLocaleDateString(undefined,
        { day: 'numeric', month: 'short', year: d.getFullYear() === year ? undefined : 'numeric' });
      tapeEl.append(el);
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'entry';
    b.dataset.i = i;
    const r = document.createElement('b');
    r.textContent = fmtTok(h.r);
    b.append(h.e + '=', r);
    b.setAttribute('aria-label', `${h.e} equals ${fmtTok(h.r)}. Tap to use result`);
    tapeEl.append(b);
  });
  toBottom();
}

function clearHistory() {
  if (!history.length) return;
  trash = history;
  history = [];
  store.set('calc-trash', trash);
  store.set('calc-history', history);
  renderTape();
}
function recoverHistory() {
  if (!trash.length) return;
  history = trash.concat(history).slice(-500);
  trash = [];
  store.set('calc-history', history);
  store.set('calc-trash', trash);
  renderTape();
  tapeEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' }); // visual "it worked"
}

// Tap a past result to use it (or the recover hint)
tapeEl.addEventListener('click', e => {
  if (e.target.closest('.recover')) { haptic(); return recoverHistory(); }
  const b = e.target.closest('.entry');
  if (!b) return;
  if (e.detail) b.blur();
  const h = history[+b.dataset.i];
  if (!h) return;
  resetIfError();
  if (isNum(last())) tokens[tokens.length - 1] = h.r; else tokens.push(h.r);
  fresh = true;
  if (appEl.classList.contains('full')) setFull(false);
  render();
});

const actions = {
  ac() { tokens = []; fresh = false; error = false; render(); },
  neg: negate, pct: percent, back, eq: equals,
  clear() { this.ac(); clearHistory(); },
  settings: openSettings,
  sci() { sciEl.hidden = !sciEl.hidden; store.set('calc-sci', !sciEl.hidden); render(); },
  '2nd': toggleSecond,
  rad() { settings.rad = !settings.rad; store.set('calc-settings', settings); showUnit(); render(); },
};

function setTape(show) {
  tapeEl.hidden = !show;
  syncFs();
}

// ---- Scientific panel (9-dot key) ----
const SCI = [
  ['2nd', '2nd'], ['sin(', 'sin', 'sin⁻¹(', 'sin⁻¹'], ['cos(', 'cos', 'cos⁻¹(', 'cos⁻¹'], ['tan(', 'tan', 'tan⁻¹(', 'tan⁻¹'], ['logᵧ', 'logᵧ'], ['log₂(', 'log₂', '2^(', '2ˣ'],
  ['rad', 'Deg'], ['sinh(', 'sinh', 'sinh⁻¹(', 'sinh⁻¹'], ['cosh(', 'cosh', 'cosh⁻¹(', 'cosh⁻¹'], ['tanh(', 'tanh', 'tanh⁻¹(', 'tanh⁻¹'], ['ln(', 'ln', 'e^(', 'eˣ'], ['log₁₀(', 'log₁₀', '10^(', '10ˣ'],
  ['!', 'x!'], ['√(', '√'], ['∛(', '∛'], ['ʸ√', 'ʸ√x'], ['e', 'e'], ['π', 'π'],
  ['rand', 'Rand'], ['²', 'x²'], ['³', 'x³'], ['^', 'xʸ'], ['(', '('], [')', ')']
];
const sciEl = $('sci');
SCI.forEach(([k1, l1, k2, l2]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'k s';
  b.dataset.k = k1;
  b.textContent = l1;
  if (k2) Object.assign(b.dataset, { k1, l1, k2, l2 });
  sciEl.append(b);
});
const secondBtn = sciEl.querySelector('[data-k="2nd"]'), radBtn = sciEl.querySelector('[data-k="rad"]');
let second = false;
function toggleSecond() {
  second = !second;
  secondBtn.classList.toggle('on', second);
  secondBtn.setAttribute('aria-pressed', String(second));
  sciEl.querySelectorAll('[data-k2]').forEach(b => {
    b.dataset.k = second ? b.dataset.k2 : b.dataset.k1;
    b.textContent = second ? b.dataset.l2 : b.dataset.l1;
  });
}
function showUnit() {
  radBtn.textContent = settings.rad ? 'Rad' : 'Deg';
  radBtn.setAttribute('aria-label', 'Angle unit: ' + (settings.rad ? 'radians' : 'degrees') + '. Tap to switch');
}
secondBtn.setAttribute('aria-pressed', 'false');
showUnit();
sciEl.hidden = store.get('calc-sci', false) !== true;

// iPhone haptics: an invisible system switch sits on each key. A real finger tap
// toggles it and iOS plays its tick (the only web haptic iOS 26.5+ allows).
const keysEl = document.querySelector('.keys');
document.querySelectorAll('.keys > .k, .sci > .k').forEach(b => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  ['zero', 'eq'].forEach(c => { if (b.classList.contains(c)) { b.classList.remove(c); cell.classList.add(c); } });
  b.replaceWith(cell);
  const t = document.createElement('input');
  t.type = 'checkbox';
  t.setAttribute('switch', '');
  t.className = 'tick';
  t.tabIndex = -1;
  t.setAttribute('aria-hidden', 'true');
  cell.append(b, t);
});
document.addEventListener('touchstart', () => {}, { passive: true }); // lets :active show on iPhone
const ON_RELEASE = ['clear', 'settings', 'sci'];
const keyOf = el => el.closest('.cell')?.querySelector('.k')?.dataset.k;

// ---- Settings page ----
const setDlg = $('settings');
const dpLabel = v => v === 'auto' ? 'Unlimited' : v;
let usingKeyboard = false;
addEventListener('keydown', () => { usingKeyboard = true; }, true);
addEventListener('pointerdown', () => { usingKeyboard = false; }, true);
let lastView = 'Dp';
function showView(sub) { // sub = 'Dp', 'Theme' or false for the main page
  if (sub) lastView = sub;
  $('setMain').hidden = !!sub;
  $('setDp').hidden = sub !== 'Dp';
  $('setTheme').hidden = sub !== 'Theme';
  (sub ? $(sub === 'Dp' ? 'dpList' : 'themeList').querySelector('[aria-checked="true"]') : $('open' + lastView)).focus({ focusVisible: usingKeyboard });
}
function renderDp() {
  $('dpVal').textContent = dpLabel(settings.dp);
  $('dpList').textContent = '';
  DPS.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'row';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(v === settings.dp));
    b.dataset.dp = v;
    b.append(dpLabel(v));
    if (v === settings.dp) b.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>');
    $('dpList').append(b);
  });
}
function openSettings() {
  $('optTape').checked = !tapeEl.hidden;
  $('optHaptics').checked = settings.haptics;
  renderDp();
  renderThemes();
  $('setMain').hidden = false;
  $('setDp').hidden = true;
  $('setTheme').hidden = true;
  setDlg.showModal();
  setDlg.focus({ focusVisible: false });
}
function applyHaptics() {
  document.querySelectorAll('.tick').forEach(t =>
    settings.haptics ? t.setAttribute('switch', '') : t.removeAttribute('switch'));
}
applyHaptics();
const saveSettings = () => store.set('calc-settings', settings);
$('optTape').addEventListener('change', e => { setTape(e.target.checked); store.set('calc-tape', e.target.checked); });
$('optHaptics').addEventListener('change', e => { settings.haptics = e.target.checked; saveSettings(); applyHaptics(); });
$('setDone').addEventListener('click', () => setDlg.close());
$('openDp').addEventListener('click', () => showView('Dp'));
$('dpBack').addEventListener('click', () => showView(false));
$('dpList').addEventListener('click', e => {
  const b = e.target.closest('[data-dp]');
  if (!b || !DPS.includes(b.dataset.dp)) return;
  settings.dp = b.dataset.dp;
  saveSettings();
  renderDp();
  render();
  showView(false);
});

// ---- Themes ---- [name, label, preview colours: background, number key, operator]
const THEMES = [
  ['classic', 'Classic', '#000', '#f2f2f2', '#e3923b'],
  ['sakura', 'Sakura', '#1c0f16', '#ffd6e5', '#ff6f9f'],
  ['lavender', 'Lavender', '#15111d', '#e9e0fb', '#ac85ff'],
  ['peach', 'Peach', '#1c1412', '#fbe0d3', '#f0907a'],
  ['blush', 'Blush (light)', '#fff0f5', '#fff', '#ff6f9f']
];
const themeOf = n => THEMES.find(t => t[0] === n) || THEMES[0];
function applyTheme() {
  const t = themeOf(settings.theme);
  settings.theme = t[0];
  if (t[0] === 'classic') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t[0];
  document.querySelector('meta[name="theme-color"]').content = t[2];
  document.querySelector('meta[name="color-scheme"]').content = t[0] === 'blush' ? 'light' : 'dark';
}
settings.theme = themeOf(saved.theme)[0];
applyTheme();
function renderThemes() {
  $('themeVal').textContent = themeOf(settings.theme)[1];
  $('themeList').textContent = '';
  THEMES.forEach(([name, label, ...cols]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'row';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(name === settings.theme));
    b.dataset.theme = name;
    b.append(label);
    const dots = document.createElement('span');
    dots.className = 'dot';
    dots.setAttribute('aria-hidden', 'true');
    cols.forEach(c => { const i = document.createElement('i'); i.style.background = c; dots.append(i); });
    b.append(dots);
    if (name === settings.theme) b.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>');
    else b.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"></svg>');
    $('themeList').append(b);
  });
}
$('openTheme').addEventListener('click', () => showView('Theme'));
$('themeBack').addEventListener('click', () => showView(false));
$('themeList').addEventListener('click', e => {
  const b = e.target.closest('[data-theme]');
  if (!b || !THEMES.some(t => t[0] === b.dataset.theme)) return;
  settings.theme = b.dataset.theme;
  saveSettings();
  applyTheme();
  renderThemes();
  $('themeList').querySelector('[aria-checked="true"]').focus({ focusVisible: usingKeyboard });
});

// Long press the trash key to recover the last cleared history
const trashBtn = document.querySelector('[data-k="clear"]').parentElement;
let pressTimer = 0, longFired = false;
trashBtn.addEventListener('pointerdown', () => {
  longFired = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    longFired = true;
    if (!trash.length) return;
    recoverHistory();
    // Brighten flash on the 🗑 key (finger is still down, so start/end at the pressed brightness)
    trashBtn.querySelector('.k').animate({ filter: ['brightness(1.35)', 'brightness(2)', 'brightness(1.35)'] }, { duration: 500, easing: 'ease-out' });
  }, 500);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t =>
  trashBtn.addEventListener(t, () => clearTimeout(pressTimer)));
trashBtn.addEventListener('contextmenu', e => e.preventDefault());

// Haptic tick where the browser allows it (Android; iPhone web apps can't)
function haptic() { if (settings.haptics) navigator.vibrate?.(8); }

function press(k) {
  haptic();
  if (/^[\d.]$/.test(k)) digit(k);
  else if (isOp(k)) op(k);
  else if (k === '(') openParen();
  else if (k === ')') closeParen();
  else if (FN[k]) func(k);
  else if (POST[k]) postfix(k);
  else if (k === 'e' || k === 'π' || k === 'rand') constant(k);
  else actions[k]?.();
}
// Finger/mouse: act on touch-down so fast taps are never lost (trash waits for release: long press = recover)
appEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const k = keyOf(e.target);
  if (k && !ON_RELEASE.includes(k)) press(k);
});
appEl.addEventListener('click', e => {
  const k = keyOf(e.target);
  if (!k) return;
  if (e.target.classList.contains('tick')) {
    e.target.blur();
    if (k === 'clear' && longFired) longFired = false;
    else if (ON_RELEASE.includes(k)) press(k);
    return;
  }
  press(k); // keyboard or screen reader pressing the button itself
});

// Keyboard support
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || setDlg.open) return;
  const k = e.key, map = { '*': '×', x: '×', '/': '÷', '-': '−', '+': '+', '^': '^' };
  if (k === 'Enter' && document.activeElement?.matches('button:focus-visible')) return;
  if (appEl.classList.contains('full') && /^[\d.%=+\-*\/x]$|^(Enter|Backspace|Escape|Delete)$/.test(k)) setFull(false);
  if (/^[\d.]$/.test(k)) digit(k);
  else if (map[k]) op(map[k]);
  else if (k === 'Enter' || k === '=') equals();
  else if (k === 'Backspace') back();
  else if (k === 'Escape' || k === 'Delete') actions.ac();
  else if (k === '%') percent();
  else if (k === '(') openParen();
  else if (k === ')') closeParen();
  else if (k === '!') postfix('!');
  else return;
  e.preventDefault();
});

// Lock the page like a native app: only the history list may scroll
document.addEventListener('touchmove', e => {
  if (!e.target.closest('.tape, #settings')) e.preventDefault();
}, { passive: false });
// No pinch-zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());

addEventListener('resize', fit);
setTape(store.get('calc-tape', true) !== false);
renderTape();
render();
// iOS settles the home screen layout after first paint (and again when reopened),
// so keep the history pinned to the newest line whenever its box changes size.
new ResizeObserver(toBottom).observe(tapeEl);
addEventListener('pageshow', toBottom);

// Offline copy so it opens instantly from the home screen
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
